<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="매일 새로운 영감을 만나는 명언 생성기">
  <title>오늘의 한 문장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quote-app">
    <header class="site-header">
      <div class="header-row">
        <p class="eyebrow">A LITTLE INSPIRATION</p>
        <div class="theme-switcher" role="group" aria-label="테마 선택">
          <button class="theme-button active" id="light-theme-button" type="button" aria-pressed="true">라이트</button>
          <button class="theme-button" id="dark-theme-button" type="button" aria-pressed="false">다크</button>
        </div>
      </div>
      <h1>오늘의 한 문장</h1>
      <p class="intro">잠시 멈추고, 마음에 남는 문장을 만나보세요.</p>
    </header>

    <section class="quote-card" aria-live="polite" aria-atomic="true">
      <div class="quote-mark" aria-hidden="true">“</div>
      <p class="category" id="category">마음</p>
      <blockquote id="quote">작은 것들을 소중히 여기는 사람에게 큰 행복이 찾아온다.</blockquote>
      <p class="author" id="author">— 윌리엄 모리스</p>
      <div class="card-actions">
        <button class="icon-button" id="copy-button" type="button" aria-label="명언 복사" title="명언 복사">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="9" y="9" width="10" height="10" rx="1.5"></rect>
            <path d="M15 9V5.5A1.5 1.5 0 0 0 13.5 4h-7A1.5 1.5 0 0 0 5 5.5v7A1.5 1.5 0 0 0 6.5 14H9"></path>
          </svg>
          <span class="sr-only">명언 복사</span>
        </button>
        <button class="new-quote-button" id="new-quote-button" type="button">
          <span>새로운 명언 보기</span>
          <span aria-hidden="true">↗</span>
        </button>
      </div>
    </section>

    <footer class="site-footer">
      <span id="quote-count">01</span><span class="count-divider">/</span><span>24</span>
      <span class="footer-label">오늘의 영감</span>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite">명언을 복사했어요.</div>
  <script src="script.js"></script>
</body>
</html>
